<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Settings — PaperStore</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { overflow-x: hidden; background: #f1f5f9; }
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 800px; margin: 0 auto; padding: 0 1rem; color: #1e293b; background: #f1f5f9; }
    
    .site-banner { position: relative; width: 100vw; left: 50%; transform: translateX(-50%); line-height: 0; margin-bottom: 2.5rem; height: 120px; overflow: hidden; background-color: #fdfdfb; }
    .site-banner img { height: 120px; width: auto; max-width: none; display: block; }
    
    .back-btn { position: absolute; top: 50%; left: 1rem; transform: translateY(-50%); background: rgba(255,255,255,0.25); backdrop-filter: blur(12px) saturate(180%); -webkit-backdrop-filter: blur(12px) saturate(180%); border: 1px solid rgba(255,255,255,0.5); border-radius: 8px; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.1); text-decoration: none; color: #333; z-index: 50; }
    .back-btn:hover { background: rgba(255,255,255,0.45); }
    
    @media (max-width: 800px) { body { max-width: 100%; } }
    
    .settings-container { background: #fff; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1); border: 1px solid #e2e8f0; }
    
    h1 { font-size: 1.5rem; font-weight: 700; color: #0f172a; margin-bottom: 1.5rem; }
    
    .form-group { margin-bottom: 1.5rem; }
    
    .form-group label { display: block; font-weight: 600; font-size: 0.95rem; color: #334155; margin-bottom: 0.5rem; }
    
    .form-group p { font-size: 0.85rem; color: #64748b; margin-bottom: 0.75rem; line-height: 1.4; }
    
    textarea { width: 100%; height: 150px; padding: 0.75rem 1rem; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.95rem; line-height: 1.5; resize: vertical; font-family: inherit; color: #334155; outline: none; transition: border-color 0.15s, box-shadow 0.15s; }
    textarea:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15); }
    
    .actions { display: flex; align-items: center; gap: 1rem; }
    
    button { background: #2563eb; color: #fff; border: none; padding: 0.6rem 1.5rem; border-radius: 8px; font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: background 0.15s; box-shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1); }
    button:hover { background: #1d4ed8; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    
    #status-msg { font-size: 0.9rem; font-weight: 500; min-height: 1.5em; }
    #status-msg.success { color: #16a34a; }
    #status-msg.error { color: #dc2626; }
  </style>
</head>
<body>
  <div class="site-banner">
    <img src="/static/banner-teleosis.png" alt="Teleosis.ai" />
    <a class="back-btn" href="/" aria-label="Back to library">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </a>
  </div>

  <div class="settings-container">
    <h1>Settings</h1>
    <div class="form-group">
      <label for="about-me">About Me (Custom Summary Context)</label>
      <p>Configure details about your background, career, or level of expertise. All AI-generated paper summaries will be customized to explain details and relevance specifically for you.</p>
      <textarea id="about-me" placeholder="e.g. I have a data science masters but I am not a hands-on engineer professionally. Focus on high-level architecture and business value. Explain complex mathematics with analogies..."></textarea>
    </div>
    <div class="actions">
      <button id="save-btn">Save Settings</button>
      <span id="status-msg"></span>
    </div>
  </div>

  <script src="/static/utils.js?v=2"></script>
  <script src="/static/settings.js?v=1"></script>
</body>
</html>
