services:
  db:
    ports: !override
      - "5434:5432"

  api:
    command: ["uv", "run", "uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "8000:8000"
    environment:
      # Dev uses its own db container (host port 5434), never the production database.
      DATABASE_URL: postgresql://paperstore:paperstore@db:5432/paperstore
      GOOGLE_REDIRECT_URI: http://localhost:8000/auth/callback
      GOOGLE_JS_ORIGIN: http://localhost:8000
      OAUTHLIB_INSECURE_TRANSPORT: "1"
      # Dev uploads go to DEV_DRIVE_FOLDER_ID, or the Drive root, never the production folder.
      DRIVE_FOLDER_ID: ${DEV_DRIVE_FOLDER_ID:-}
    volumes:
      - ./backend/src:/app/src
      - ./frontend:/frontend
    # Keep dev off the shared gateway networks so no public route can reach it.
    networks: !reset
      - default
