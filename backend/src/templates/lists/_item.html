<li class="item card{% if item.read_at %} is-read{% endif %}" id="item-{{ item.id }}">
  <input class="tick" type="checkbox" aria-label="Read {{ item.title }}"
         {% if item.read_at %}checked{% endif %}
         hx-post="/lists/{{ item.list_id }}/items/{{ item.id }}/tick"
         hx-target="#item-{{ item.id }}" hx-swap="outerHTML" />
  <div class="item-body">
    <div class="item-title">{{ item.title }}</div>
    <div class="item-meta">
      {%- if item.authors %}{{ item.authors | join(", ") }}{% endif -%}
      {%- if item.authors and item.year %} · {% endif -%}
      {%- if item.year %}{{ item.year }}{% endif -%}
    </div>
    {% if item.note %}<div class="item-note">{{ item.note }}</div>{% endif %}
  </div>
  <button class="btn-link" type="button" title="Drop this item from the list"
          hx-delete="/lists/{{ item.list_id }}/items/{{ item.id }}"
          hx-target="#item-{{ item.id }}" hx-swap="outerHTML"
          hx-confirm="Drop “{{ item.title }}” from this list?">Drop</button>
</li>
