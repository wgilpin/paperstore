<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PaperStore</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      margin: 0;
      padding: 16px;
      width: 280px;
      font-size: 14px;
      color: #1a1a1a;
    }
    h1 {
      font-size: 16px;
      margin: 0 0 12px;
    }
    #status {
      padding: 10px 12px;
      border-radius: 6px;
      background: #f3f4f6;
      min-height: 36px;
      line-height: 1.4;
    }
    #status.submitting { background: #eff6ff; color: #1d4ed8; }
    #status.success    { background: #f0fdf4; color: #166534; }
    #status.duplicate  { background: #fefce8; color: #854d0e; }
    #status.error      { background: #fef2f2; color: #991b1b; }
    button {
      margin-top: 12px;
      width: 100%;
      padding: 8px;
      border: none;
      border-radius: 6px;
      background: #2563eb;
      color: white;
      font-size: 14px;
      cursor: pointer;
    }
    button:disabled { background: #93c5fd; cursor: default; }
    button.secondary {
      background: #f3f4f6;
      color: #1a1a1a;
      border: 1px solid #d1d5db;
    }
    button.secondary:hover { background: #e5e7eb; }
    #viewBtn { display: none; }
    #viewLink {
      display: none;
      text-align: center;
      margin-top: 12px;
      font-size: 14px;
    }
    #viewLink a {
      color: #2563eb;
      text-decoration: none;
      font-weight: 600;
    }
    #viewLink a:hover {
      text-decoration: underline;
    }
    .tag-pill {
      display: inline-flex;
      align-items: center;
      background: #e0f2fe;
      color: #0369a1;
      border-radius: 9999px;
      padding: 3px 10px;
      font-size: 12px;
      font-weight: 500;
      margin-right: 6px;
      margin-bottom: 6px;
      animation: fadeIn 0.15s ease-out;
    }
    .tag-pill .remove-tag {
      margin-left: 6px;
      cursor: pointer;
      font-weight: bold;
      color: #0284c7;
    }
    .tag-pill .remove-tag:hover {
      color: #0369a1;
    }
    #tagInput {
      width: 100%;
      box-sizing: border-box;
      padding: 6px 10px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    #tagInput:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.1);
    }
    #autocompleteContainer {
      position: absolute;
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      max-height: 120px;
      overflow-y: auto;
      width: 100%;
      box-sizing: border-box;
      z-index: 10;
      display: none;
      margin-top: 2px;
    }
    .autocomplete-suggestion {
      padding: 6px 10px;
      cursor: pointer;
      font-size: 13px;
      color: #374151;
      transition: background-color 0.1s;
    }
    .autocomplete-suggestion:hover, .autocomplete-suggestion.active {
      background: #f3f4f6;
      color: #111827;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>
  <h1>PaperStore</h1>
  <div id="status">Checking current page…</div>
  <div id="viewLink"><a href="#" target="_blank">View in Paperstore</a></div>
  
  <div id="tagSection" style="display: none; position: relative; margin-top: 14px; text-align: left;">
    <h2 style="font-size: 13px; margin: 0 0 6px; font-weight: 600; color: #4b5563;">Tags</h2>
    <div id="tagContainer" style="display: flex; flex-wrap: wrap; margin-bottom: 2px;"></div>
    <input type="text" id="tagInput" placeholder="Add a tag (press Enter)..." autocomplete="off" />
    <div id="autocompleteContainer"></div>
  </div>

  <button id="addBtn" disabled>Add Paper</button>
  <button id="viewBtn" class="secondary">View in Paperstore</button>
  <button id="openBtn" class="secondary">Open Paperstore</button>
  <script src="popup.js"></script>
</body>
</html>
