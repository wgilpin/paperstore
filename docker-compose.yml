services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: paperstore
      POSTGRES_USER: paperstore
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    expose:
      - "8000"
    env_file:
      - .env
    volumes:
      # Read-only credentials file from host (must exist before starting)
      - "${GOOGLE_CREDENTIALS_PATH}:/run/secrets/paperstore-credentials.json:ro"
      # Named volume for token so Docker creates it; persists across restarts
      - google_token:/var/lib/paperstore/token
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://paperstore:${POSTGRES_PASSWORD}@db:5432/paperstore
      GOOGLE_CREDENTIALS_PATH: /run/secrets/paperstore-credentials.json
      GOOGLE_TOKEN_PATH: /var/lib/paperstore/token/token.json
    networks:
      - web-routing
      - default

networks:
  web-routing:
    external: true

volumes:
  postgres_data:
  google_token:

